[package]
name = "dns-update"
description = "Dynamic DNS update (RFC 2136 and cloud) library for Rust"
version = "0.1.6"
edition = "2021"
authors = [ "Stalwart Labs <hello@stalw.art>"]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/stalwartlabs/dns-update"
homepage = "https://github.com/stalwartlabs/dns-update"
keywords = ["dns", "update", "rfc2136", "dynamic"]
categories = ["network-programming"]
readme = "README.md"
resolver = "2"

[dependencies]
hickory-client = { version = "0.24", features = ["dns-over-rustls", "dnssec-ring", "dns-over-https-rustls"], default-features = false }
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.116"
serde_urlencoded = "0.7.1"
sha1 = "0.10"
async-lock = "3.4.2"
cfg-if = "1.0.4"
rustls = "0.23.36"
webpki-roots = "1.0.5"
hyper = { version = "1.8.1", features = ["http1", "http2", "client"] }
http = "1.4.0"
http-body = "1.0.1"
http-body-reader = "0.1.2"

# Tokio dependencies
tokio = { version = "1", features = ["rt", "net"], optional = true }
tokio-rustls = { version = "0.26.4", optional = true }
hyper-util = { version = "0.1.19", optional = true }

# Smol dependencies
futures-rustls = { version = "0.26.0", optional = true }
smol-hyper = { version = "0.1.1", optional = true }
smol = { version = "2.0.2", optional = true }
smol-timeout = { version = "0.6.1", optional = true }


[features]
default = ["smol"]
smol = ["dep:smol", "dep:smol-hyper", "dep:futures-rustls", "dep:smol-timeout"]
tokio = ["dep:tokio", "dep:hyper-util", "dep:tokio-rustls"]
integration_tests = []


[dev-dependencies]
tokio = { version = "1", features = ["full"] }
mockito = "1.2"
smol-macros = "0.1.1"
macro_rules_attribute = "0.2.2"
